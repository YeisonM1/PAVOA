name: Conciliar pagos

# Un aviso de pago se puede perder —una caida de red, un despliegue a
# destiempo— y entonces el dinero entra sin que exista la orden. El 1 de
# octubre de 2026 paso con una transferencia y nadie pudo notarlo: la clienta
# pago y el pedido no existia en ningun lado.
#
# Esto le pregunta a Mercado Pago cada diez minutos cuales pagos aprobo y
# completa los que no llegaron a ser pedido. Se le pregunta a Mercado Pago en
# vez de revisar nuestros propios registros porque si el aviso nunca llega, el
# numero del pago tampoco: asi la red no depende de haber recibido nada.
#
# Vive aqui y no en Vercel porque el plan Hobby solo permite una ejecucion
# diaria, y un pedido no puede esperar hasta el dia siguiente.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  conciliar:
    runs-on: ubuntu-latest
    steps:
      - name: Revisar pagos aprobados sin pedido
        run: |
          RESPUESTA=$(curl -sS -X POST "https://www.pavoa.com.co/api/procesar-pago" \
            -H "Content-Type: application/json" \
            -H "x-preview-secret: ${{ secrets.PAVOA_MAINTENANCE_SECRET }}" \
            -d '{"type":"mp-conciliar"}' \
            --max-time 60)

          echo "$RESPUESTA"

          # Un pedido rescatado significa que un aviso se perdio. El trabajo no
          # falla —el pedido ya quedo bien— pero deja el caso a la vista en el
          # historial en vez de pasar en silencio.
          if echo "$RESPUESTA" | grep -q '"rescatados":\[{'; then
            echo "::warning::Se rescato al menos un pedido cuyo aviso de pago no llego"
          fi

          # La tanda se limita para no agotar los diez segundos de la funcion.
          # Si quedo algo para la siguiente, conviene saberlo: varios pagos
          # huerfanos a la vez no es una perdida aislada.
          if echo "$RESPUESTA" | grep -q '"postergados":\["'; then
            echo "::warning::Quedaron pagos sin revisar en esta tanda"
          fi

          # Un pago aprobado con una referencia a medias no se puede rescatar
          # solo, pero es dinero cobrado que quizas no llego a ser pedido: la
          # tarea queda en rojo hasta que una persona lo resuelva. Un aviso en
          # verde no le llega a nadie, y esto tiene que llegarle a alguien.
          if echo "$RESPUESTA" | grep -q '"anomalias":[{'; then
            echo "::error::Hay un pago aprobado con referencia incompleta y sin pedido. Revisalo a mano."
            exit 1
          fi

          # Una consulta que falla debe doler. Si se dejara pasar, un error de
          # credenciales se veria igual que una tanda limpia y la red quedaria
          # caida sin que nadie se enterara.
          echo "$RESPUESTA" | grep -q '"ok":true' || {
            echo "::error::La conciliacion no pudo correr"
            exit 1
          }
